name: Integration

on:
  push:
    branches:
    - main
  pull_request: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest

    outputs:
      yaml_changed: ${{ steps.changed-files.outputs.yaml }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get Changed Files
      id: changed-files
      uses: dorny/paths-filter@v4
      with:
        list-files: json
        filters: |
          yaml:
          - '**/*.yaml'
          - '**/*.yml'

  yaml:
    needs:
    - changed
    if: ${{ needs.changed.outputs.yaml_changed != 'false' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Lint YAML Files
      id: yaml-lint
      run: |
        yamllint .
